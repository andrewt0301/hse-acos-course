course_tracks:
  - id: computer-architecture
    serial: "03"
    tone: architecture
    title: Computer Architecture
    eyebrow: Module 3
    description: >
      RISC-V, processor design, memory hierarchy, virtual memory, parallelism,
      and optimization.
    anchor: /#computer-architecture
    list_intro: Lecture sequence
    items:
      - title: Introduction. Course motivation. Historical perspective.
        url: /part1ca/01_Introduction/lecture.html
      - title: Data types. Byte ordering. Integer formats.
        url: /part1ca/02_DataTypes/lecture.html
      - title: Computer organization. Microprocessor. RISC and RISC-V. Assembly language.
        url: /part1ca/03_CPU/lecture.html
      - title: RISC-V instructions. Instruction formats.
        url: /part1ca/04_Instructions/lecture.html
      - title: Pseudo instructions, macros, and includes. Conditions, loops, loads, and stores.
        url: /part1ca/05_MacrosBranchesArrays/lecture.html
      - title: Subroutines. Call stack. Calling conventions.
        url: /part1ca/06_CallStack/lecture.html
      - title: Floating-point format. IEEE 754. Floating-point instructions.
        url: /part1ca/07_FP/lecture.html
      - title: Memory and caches.
        url: /part1ca/08_Caches/lecture.html
      - title: Virtual memory.
        url: /part1ca/09_VM/lecture.html
      - title: Processor and pipeline.
        url: /part1ca/10_Pipeline/lecture.html
      - title: Exceptions and interrupts.
        url: /part1ca/11_Exceptions/lecture.html
      - title: Input and output.
        url: /part1ca/12_MMIO/lecture.html
      - title: "Instruction-level parallelism: Multiple issue and out-of-order execution."
        url: /part1ca/13_MultiIssue/lecture.html
      - title: Thread-level parallelism.
        url: /part1ca/14_TLP/lecture.html
      - title: Optimizations.
        url: /part1ca/15_Optimize/lecture.html
      - title: "Data-level parallelism: Vectors and SIMD."
        url: /part1ca/16_DLP/lecture.html
    actions:
      - title: Homeworks
        url: /part1ca/Tasks/homeworks.html
      - title: Final test
        url: /part1ca/final_tests.html

  - id: operating-systems
    serial: "04"
    tone: systems
    title: Operating Systems
    eyebrow: Module 4
    description: >
      Linux internals, C, processes, files, networking, linking, and system programming.
    anchor: /#operating-systems
    list_intro: Lecture sequence
    items:
      - title: Operating system architecture. Linux.
        url: /part2os/01_OS_Architecture/lecture.html
      - title: C programming language.
        url: /part2os/02_C/lecture.html
      - title: System calls.
        url: /part2os/03_SystemCalls/lecture.html
      - title: Executable file format. Linking and loading.
        url: /part2os/04_Linking/lecture.html
      - title: Dynamic memory allocation and string handling.
        url: /part2os/05_Strings/lecture.html
      - title: Processes and threads.
        url: /part2os/06_Processes/lecture.html
      - title: I/O and files.
        url: /part2os/07_Synch/lecture.html
      - title: Synchronization.
        url: /part2os/08_IPC/lecture.html
      - title: Inter-process communication.
        url: /part2os/09_IPC/lecture.html
      - title: Users, groups, and permissions.
        url: /part2os/10_Permissions/lecture.html
      - title: Virtual Machines.
        url: /part2os/11_VM/lecture.html
      - title: Networking.
        url: /part2os/12_Networking/lecture.html
      - title: Sockets.
        url: /part2os/13_Sockets/lecture.html
      - title: High-level Languages and Operating System.
        url: /part2os/14_Python/lecture.html
    actions:
      - title: Final test
        url: /part2os/final_tests.html

